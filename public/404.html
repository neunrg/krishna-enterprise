<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Krishna Enterprise</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#eeefe9" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        background: #eeefe9;
        color: #23251d;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card { max-width: 480px; text-align: center; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: #4d4f46; margin-bottom: 20px;
      }
      .eyebrow::before, .eyebrow::after {
        content: ""; height: 3px; width: 24px; border-radius: 999px; background: #f7a501;
      }
      h1 { font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 700; }
      p { margin-top: 14px; color: #4d4f46; line-height: 1.6; }
      a.btn {
        display: inline-flex; align-items: center; justify-content: center;
        margin-top: 28px; height: 48px; padding: 0 28px; border-radius: 6px;
        background: #f7a501; color: #23251d; font-weight: 600; text-decoration: none;
      }
      a.btn:hover { background: #dd9001; }
      .back {
        display: inline-block; margin-top: 16px; color: #4d4f46; font-size: 14px;
        text-decoration: underline; text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Krishna Enterprise</p>
      <h1>This page shipped elsewhere.</h1>
      <p>That link doesn&rsquo;t exist on our site. Stationery products and enquiries are still right where we left them.</p>
      <a class="btn" href="index.html">Back to Home</a>
      <br />
      <a class="back" href="products.html">Browse products</a>
    </main>
  </body>
</html>
